<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中國思想史 | 水墨卷軸</title>
    <style>
        :root {
            --paper-bg: #f4f3ee; /* 宣紙白底色 */
            --ink-black: #1f1f1f; /* 濃墨深色 */
            --ink-gray: #555555; /* 炭灰 */
            --light-border: #d4d0c7; /* 墨色邊框 */
            --seal-red: #9e2a2b; /* 傳統印章紅 */
        }

        body {
            font-family: "Noto Serif TC", "Songti TC", "SimSun", serif;
            background-color: var(--paper-bg);
            color: var(--ink-black);
            margin: 0;
            padding: 0;
            line-height: 2;
            /* 模擬微弱的布紋或宣紙質感背景 */
            background-image: radial-gradient(#e8e5dc 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* 頂部水墨圓章與標題區 */
        header {
            text-align: center;
            padding: 4rem 1rem 2rem 1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .seal-badge {
            display: inline-block;
            width: 90px;
            height: 90px;
            line-height: 90px;
            border: 2px solid var(--seal-red);
            border-radius: 50%;
            color: var(--seal-red);
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
            box-shadow: inset 0 0 10px rgba(158, 42, 43, 0.1);
        }

        header h1 {
            font-size: 3rem;
            margin: 0 0 0.5rem 0;
            letter-spacing: 0.25em;
            font-weight: normal;
        }

        header p {
            font-size: 1.1rem;
            color: var(--ink-gray);
            letter-spacing: 0.15em;
            margin: 0;
        }

        /* 模擬卷軸主體容器 */
        .scroll-container {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .scroll-box {
            background: #ffffff;
            border: 1px solid var(--light-border);
            border-top: 4px solid var(--ink-black);
            border-bottom: 4px solid var(--ink-black);
            padding: 3rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            position: relative;
        }

        .section-title {
            font-size: 1.4rem;
            border-bottom: 1px dashed var(--light-border);
            padding-bottom: 0.8rem;
            margin-top: 0;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }

        /* 單元列表 */
        .chapter-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .chapter-item {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px dashed #eee;
            transition: transform 0.2s ease;
        }

        .chapter-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .chapter-item:hover {
            transform: translateX(5px);
        }

        .chapter-item h3 {
            margin: 0 0 0.4rem 0;
            font-size: 1.35rem;
        }

        .chapter-item h3 a {
            color: var(--ink-black);
            text-decoration: none;
            letter-spacing: 0.05em;
        }

        .chapter-item h3 a:hover {
            color: var(--seal-red);
        }

        .chapter-item p {
            margin: 0;
            color: var(--ink-gray);
            font-size: 0.95rem;
        }

        /* 底部卷軸收尾與版權 */
        footer {
            text-align: center;
            padding: 3rem;
            color: var(--ink-gray);
            font-size: 0.85rem;
            letter-spacing: 0.15em;
        }
    </style>
</head>
<body>

    <header>
        <!-- 模擬圖像上方的紅色圓章 -->
        <div class="seal-badge">思想</div>
        <h1>中國思想史</h1>
        <p>溯源先秦至明清之文人墨韻</p>
    </header>

    <div class="scroll-container">
        <div class="scroll-box">
            <h2 class="section-title">―― 課程卷軸目錄 ――</h2>
            <ul class="chapter-list">
                <li class="chapter-item">
                    <h3><a href="./chapters/01-pre-qin-confucianism.html">一、先秦儒家思想</a></h3>
                    <p>探討孔子「仁」、孟子「性善說」與荀子「性惡說」之建構與倫理實踐。</p>
                </li>
                <li class="chapter-item">
                    <h3><a href="./chapters/02-daoism-and-legalism.html">二、先秦道家與名法</a></h3>
                    <p>老莊之「道」、自然無為，以及法家申韓之法術勢的統御思辨。</p>
                </li>
                <li class="chapter-item">
                    <h3><a href="./chapters/03-song-ming-neo-confucianism.html">三、宋明理學與心學</a></h3>
                    <p>程朱理學之「格物致知」與陸王心學之「心外無理」的義理轉折。</p>
                </li>
            </ul>
        </div>
    </div>

    <footer>
        <p>中國思想史課程學習網 &mdash; 墨韻流白</p>
    </footer>

</body>
</html>
